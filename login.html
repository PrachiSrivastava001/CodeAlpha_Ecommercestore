<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                font-family:Arial;background:#fff0f6;display:flex;justify-content:center;align-items:center;height:100vh
            }
                form{
                    background:white;padding:30px;border-radius:12px
                }
                    input{
                        display:block;width:220px;margin:10px 0;padding:10px
                    }
                    button{
                        background:#ff3399;color:white;border:none;padding:10px;width:100%;border-radius:8px
                    }
        </style>
    </head>
    <body>
        <form onsubmit="login(event)">
            <h2>Login / Register</h2>
            <input id="email" type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button>Login</button>
            <p id="msg"></p>
        </form>
        <script>function login(e){e.preventDefault();localStorage.setItem("user",document.getElementById("email").value);document.getElementById("msg").innerText="Success! Redirecting...";setTimeout(()=>{location.href="index.html"},1000)}</script>
    </body>
</html>
